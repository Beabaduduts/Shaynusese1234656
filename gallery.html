body.lock{overflow:hidden}
.hand{font-family:"Caveat","Segoe Print",cursive;font-size:1.35rem;color:var(--sage-d);margin:0}
/* header (compact) */
.head{position:relative;text-align:center;padding:18px 20px 16px;background:linear-gradient(120deg,var(--blush),var(--cream) 50%,var(--sage));border-bottom:3px dotted var(--sage-d);z-index:2}
.head h1{font:italic 600 clamp(1.9rem,5vw,2.8rem)/1.1 "Fraunces",Georgia,serif;color:var(--olive);margin:0}
.site{margin:0;font-weight:700;letter-spacing:.05em;color:var(--sage-d);font-size:.95rem}
.doodle{position:absolute;left:4%;top:8px;width:64px}.head:after{content:"✦";position:absolute;right:6%;top:14px;color:#d9b84a;font-size:1.3rem}
/* gallery grid: 3 columns × 4 rows on desktop */
main{flex:1;max-width:1000px;width:100%;margin:0 auto;padding:30px 20px;position:relative;z-index:2}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.card{margin:0;background:var(--paper);border:1.5px solid var(--sage);border-radius:12px;padding:10px 10px 8px;box-shadow:0 3px 0 rgba(169,184,145,.45);position:relative;transition:transform .25s,border-color .25s}
.card:before{content:"";position:absolute;top:-8px;left:50%;width:56px;height:16px;margin-left:-28px;background:rgba(246,231,168,.85);transform:rotate(-3deg);z-index:1;pointer-events:none}
.card:hover{transform:translateY(-3px);border-color:var(--blush-d)}
.thumb{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;border-radius:8px;overflow:hidden}
.thumb img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--blush)}
.card figcaption{font-family:"Caveat","Segoe Print",cursive;font-size:1.2rem;color:var(--sage-d);text-align:center;padding-top:6px}
:focus-visible{outline:3px solid var(--blush-d);outline-offset:3px;border-radius:8px}
footer{text-align:center;padding:20px;color:var(--sage-d);font-size:.95rem;position:relative;z-index:2}
/* lightbox */
.lb{position:fixed;inset:0;z-index:100;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:16px;background:rgba(62,58,38,.86);opacity:0;transition:opacity .25s}
.lb[hidden]{display:none}.lb.open{opacity:1}
.lb-fig{margin:0;text-align:center;color:#fdf6ec;min-width:0}
.lb-img{display:block;margin:0 auto;max-width:100%;max-height:calc(100vh - 140px);max-height:calc(100dvh - 140px);object-fit:contain;border-radius:6px;border:4px solid var(--paper);background:var(--paper);animation:swap .3s}
@keyframes swap{from{opacity:.2}to{opacity:1}}
.lb-fig figcaption{margin-top:10px}.lb-cap{font-family:"Caveat","Segoe Print",cursive;font-size:1.4rem}.lb-count{margin-left:8px;font-size:.9rem;opacity:.85}
.ctl{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;border:0;cursor:pointer;transition:transform .2s,box-shadow .2s}
.ctl:hover{transform:scale(1.1);box-shadow:0 0 0 3px rgba(255,253,247,.5)}.ctl:focus-visible{outline:3px solid var(--butter)}
.close{position:absolute;top:14px;right:14px;background:#F6E5EF;color:#765267;z-index:2}.prev{background:#E5EDE2;color:#52694F}.next{background:#F8F0CB;color:#796A3F}
/* particles + sparkles */
#particles{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.p{position:absolute;bottom:-20px;border-radius:50%;opacity:0;animation:float linear infinite}
@keyframes float{0%{transform:translate(0,0);opacity:0}15%{opacity:.5}85%{opacity:.4}100%{transform:translate(var(--dx),-110vh);opacity:0}}
.spark{position:fixed;pointer-events:none;z-index:200;font-size:12px;animation:spark .8s ease-out forwards}
@keyframes spark{to{opacity:0;transform:translate(var(--sx),var(--sy)) scale(.3)}}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.doodle{width:44px}
.lb{grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;align-items:center}.lb-fig{grid-column:1/-1;grid-row:1}.lb-img{max-height:calc(100vh - 170px);max-height:calc(100dvh - 170px)}
.prev{justify-self:end;margin-right:10px}.next{justify-self:start;margin-left:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#particles{display:none}}

/* ===== site navigation (same header as the other pages) ===== */
.skip{position:absolute;left:-999px;top:8px;background:#fffdf8;color:#24402f;padding:.5rem 1rem;z-index:99;border-radius:8px}.skip:focus{left:8px}
.site-header{--h-blush:#fbe3e4;--h-paper:#fffdf8;--h-forest:#24402f;--h-rose:#e9a9b4;--h-sage:#9db79a;--h-ease:cubic-bezier(.3,.7,.2,1);
position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem clamp(1rem,4vw,3rem);padding-top:calc(.7rem + env(safe-area-inset-top,0px));
background:color-mix(in srgb,var(--h-blush) 82%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid color-mix(in srgb,var(--h-sage) 45%,transparent);
font:400 1.05rem/1.7 "DM Sans",system-ui,sans-serif;color:var(--h-forest)}
.site-header .brandwrap{display:flex;align-items:center;gap:.7rem}
.site-header .brand{font:italic 500 1.7rem/1 "Cormorant Garamond",Georgia,serif;text-decoration:none;color:var(--h-forest)}
#logo{position:relative;width:54px;height:54px;border:0;background:none;cursor:pointer;padding:0;border-radius:50%}
#logo img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%}
#logo svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#logo .spiral{stroke-dasharray:260;stroke-dashoffset:260;opacity:0}
#logo.go{animation:bounce .8s var(--h-ease)}#logo.go .spiral{animation:draw .8s ease-out}
@keyframes bounce{0%{transform:none}25%{transform:translateY(-9px) rotate(-14deg) scale(1.12)}55%{transform:translateY(1px) rotate(8deg)}80%{transform:rotate(-3deg)}100%{transform:none}}
@keyframes draw{0%{stroke-dashoffset:260;opacity:1}70%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.site-header nav ul{display:flex;gap:clamp(.8rem,2vw,1.8rem);list-style:none;margin:0;padding:0}
.site-header nav a{text-decoration:none;color:inherit;font-size:.95rem;padding:.3rem .1rem;background:linear-gradient(var(--h-rose),var(--h-rose)) 0 100%/0 2px no-repeat;transition:color .3s,background-size .35s var(--h-ease)}
.site-header nav a:hover,.site-header nav a[aria-current="page"]{color:#b4586b;background-size:100% 2px}
#menu{display:none;border:1px solid var(--h-sage);background:var(--h-paper);color:var(--h-forest);border-radius:99px;padding:.4rem .9rem;font:inherit;cursor:pointer}
@media (max-width:720px){#menu{display:block}.site-header nav{position:absolute;top:100%;left:0;right:0;background:var(--h-blush);padding:1rem 1.5rem;display:none;border-bottom:1px solid var(--h-sage)}.site-header nav.open{display:block}.site-header nav ul{flex-direction:column;gap:.6rem}}
@media (prefers-reduced-motion:reduce){#logo.go{outline:3px solid var(--h-rose);outline-offset:3px}}
/* video with a little cat */
.video{margin:50px auto 0;text-align:center}
.vcard{position:relative;margin:26px auto 0;max-width:460px;background:var(--paper);border:1.5px solid var(--sage);border-radius:16px;padding:14px 14px 10px;box-shadow:0 3px 0 rgba(169,184,145,.45)}
.v-ears{position:absolute;left:0;top:-25px;width:100%;height:26px;pointer-events:none}
.vframe{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;display:grid;place-items:center;background:linear-gradient(160deg,var(--blush),#e5ede2) center/cover no-repeat}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.v-ph{position:absolute;left:0;right:0;bottom:12px;font:1.25rem "Caveat","Segoe Print",cursive;color:var(--sage-d)}
.play{position:relative;z-index:1;width:132px;max-width:40%;padding:0;border:0;background:none;cursor:pointer;transition:transform .25s}
.play svg{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 6px rgba(74,63,51,.25))}
.play:hover{transform:scale(1.08) rotate(-3deg)}
.paw{position:absolute;width:26px;opacity:.4;pointer-events:none}.paw.p1{left:16px;bottom:10px;rotate:-18deg}.paw.p2{right:16px;bottom:10px;rotate:16deg}
.vcard figcaption{font-family:"Caveat","Segoe Print",cursive;font-size:1.2rem;color:var(--sage-d);padding-top:6px}

<script>
/* shayne.com gallery — lightbox, particles, sparkle cursor */
(function(){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ===== LIGHTBOX =====
     It reads each photo's src, alt text and caption straight from the gallery cards in index.html,
     so you only edit the HTML to change photos. */
  var thumbs=[].slice.call(document.querySelectorAll('.thumb'));
  var lb=document.getElementById('lb'),img=lb.querySelector('.lb-img'),cap=lb.querySelector('.lb-cap'),cnt=lb.querySelector('.lb-count');
  var closeB=lb.querySelector('.close'),prevB=lb.querySelector('.prev'),nextB=lb.querySelector('.next');
  var cur=0,opener=null,isOpen=false,timer;

  function show(i){                              // update image, caption and counter together
    cur=(i+thumbs.length)%thumbs.length;         // wraps: 12 → 1 and 1 → 12
    var t=thumbs[cur],im=t.querySelector('img');
    img.style.animation='none';void img.offsetWidth;img.style.animation='';   // replay the soft fade
    img.src=im.getAttribute('src');img.alt=im.alt;
    cap.textContent=t.parentNode.querySelector('figcaption').textContent;
    cnt.textContent=(cur+1)+' / '+thumbs.length;
  }
  function open(i){
    clearTimeout(timer);opener=thumbs[i];isOpen=true;show(i);
    lb.hidden=false;document.body.classList.add('lock');          // lock background scrolling
    requestAnimationFrame(function(){lb.classList.add('open');});
    closeB.focus();                                               // move focus into the lightbox
  }
  function close(){
    if(!isOpen)return;isOpen=false;lb.classList.remove('open');document.body.classList.remove('lock');
    timer=setTimeout(function(){lb.hidden=true;},reduce?0:250);
    if(opener)opener.focus();                                     // return focus to the photo
  }
  thumbs.forEach(function(t,i){t.addEventListener('click',function(){open(i);});});
  prevB.addEventListener('click',function(){show(cur-1);});
  nextB.addEventListener('click',function(){show(cur+1);});
  closeB.addEventListener('click',close);
  // Backdrop closes; clicks on the image, caption or any button do not.
  lb.addEventListener('click',function(e){if(!e.target.closest('button,img,figcaption'))close();});
  document.addEventListener('keydown',function(e){
    if(!isOpen)return;
    if(e.key==='Escape'){close();}
    else if(e.key==='ArrowLeft'){show(cur-1);}
    else if(e.key==='ArrowRight'){show(cur+1);}
    else if(e.key==='Tab'){                                       // keep focus inside the lightbox
      var f=[closeB,prevB,nextB],i=f.indexOf(document.activeElement);
      e.preventDefault();f[i<0?0:(i+(e.shiftKey?f.length-1:1))%f.length].focus();
    }
  });

  if(reduce)return;
  /* ===== FLOATING PARTICLES (20 tiny specks, behind content) ===== */
  var box=document.getElementById('particles'),cols=['#f4c9cf','#fffdf7','#f6e7a8'];
  for(var k=0;k<20;k++){var p=document.createElement('span');p.className='p';var s=3+Math.random()*5;
    p.style.cssText='left:'+Math.random()*100+'%;width:'+s+'px;height:'+s+'px;background:'+cols[k%3]+';--dx:'+(Math.random()*80-40)+'px;animation-duration:'+(22+Math.random()*25)+'s;animation-delay:-'+Math.random()*40+'s';
    box.appendChild(p);}
  /* ===== SPARKLE CURSOR (mouse only, throttled) ===== */
  if(matchMedia('(hover: none)').matches)return;
  var last=0,g=['✦','·','✧','♡'],c=['#e8a5b0','#e6cf7a','#c9b27a'];
  addEventListener('mousemove',function(e){var n=Date.now();if(n-last<80)return;last=n;
    var s=document.createElement('span');s.className='spark';s.textContent=g[Math.random()*4|0];
    s.style.cssText='left:'+(e.clientX+Math.random()*10-5)+'px;top:'+(e.clientY+Math.random()*10)+'px;color:'+c[Math.random()*3|0]+';--sx:'+(Math.random()*20-10)+'px;--sy:'+(Math.random()*24+6)+'px';
    document.body.appendChild(s);setTimeout(function(){s.remove();},800);});
})();
</script>
<script>
/* site navigation: menu button, logo animation */
(function(){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,menu=document.getElementById('menu'),nav=document.getElementById('nav'),logo=document.getElementById('logo');
  function close(){nav.classList.remove('open');menu.setAttribute('aria-expanded','false');}
  menu.addEventListener('click',function(){var o=nav.classList.toggle('open');menu.setAttribute('aria-expanded',o);});
  nav.addEventListener('click',function(e){if(e.target.closest('a'))close();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&nav.classList.contains('open')){close();menu.focus();}});
  var busy=false;
  logo.addEventListener('click',function(){
    if(window.scrollY>10)scrollTo({top:0,behavior:reduce?'auto':'smooth'});
    if(busy)return;busy=true;logo.classList.add('go');
    if(!reduce){var r=logo.getBoundingClientRect(),g=['♡','✿','✦','♪','✧'],c=['#e8a5b0','#e6cf7a','#6b7a4f'];
      for(var i=0;i<8;i++){var s=document.createElement('span');s.className='spark';s.textContent=g[i%5];
        s.style.cssText='left:'+(r.left+r.width/2)+'px;top:'+(r.top+r.height/2)+'px;font-size:16px;color:'+c[i%3]+';--sx:'+(Math.random()*100-50)+'px;--sy:'+(-20-Math.random()*55)+'px';
        document.body.appendChild(s);(function(el){setTimeout(function(){el.remove();},850);})(s);}}
    setTimeout(function(){logo.classList.remove('go');busy=false;},reduce?400:850);
  });
})();
</script>
<script>
/* youtube spot: reads the link in data-youtube and plays it when the cat button is pressed */
(function(){
  var box=document.getElementById('vframe');if(!box)return;
  var raw=(box.getAttribute('data-youtube')||'').trim(),btn=box.querySelector('.play'),ph=box.querySelector('.v-ph');
  var m=raw.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{11})/)||raw.match(/^([A-Za-z0-9_-]{11})$/);
  if(!m){btn.disabled=true;btn.style.cursor='default';btn.setAttribute('aria-label','Video not added yet');return;}
  var id=m[1];ph.remove();
  box.style.backgroundImage='url(https://i.ytimg.com/vi/'+id+'/hqdefault.jpg)';
  btn.addEventListener('click',function(){
    window.dispatchEvent(new Event('sh-video-play'));   // pauses the background music
    var f=document.createElement('iframe');
    f.src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0';
    f.title='YouTube video player';f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;
    box.innerHTML='';box.appendChild(f);f.focus();
  });
})();
</script>
